name: publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish"
        required: true
        type: choice
        options:
          - events
          - fusion
          - hookr
          - httpx
          - infusion
          - jsxr
          - prism
          - rsbuild-plugin-jsxr
          - scribe
          - signals
          - srvr
          - typed-env
          - verdict
      bump:
        description: "Version bump"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
          - prerelease
      dry_run:
        description: "Dry run (verify without publishing)"
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@synergy-js/${{ inputs.package }}" build

      - if: inputs.dry_run
        run: pnpm --filter "@synergy-js/${{ inputs.package }}" publish --dry-run --provenance --access public --no-git-checks

      - if: ${{ !inputs.dry_run }}
        run: |
          if [ "${{ inputs.bump }}" = "prerelease" ]; then
            pnpm --filter "@synergy-js/${{ inputs.package }}" version prerelease --preid alpha
            pnpm --filter "@synergy-js/${{ inputs.package }}" publish --tag alpha --provenance --access public
          else
            pnpm --filter "@synergy-js/${{ inputs.package }}" version "${{ inputs.bump }}"
            pnpm --filter "@synergy-js/${{ inputs.package }}" publish --provenance --access public
          fi

          git push --follow-tags
