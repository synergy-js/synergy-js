name: publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish"
        required: true
        type: choice
        options:
          - events
          - fusion
          - hookr
          - httpx
          - infusion
          - jsxr
          - prism
          - rsbuild-plugin-jsxr
          - scribe
          - signals
          - srvr
          - typed-env
          - verdict
      bump:
        description: "Version bump"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
          - prerelease
      dry_run:
        description: "Dry run (verify without publishing)"
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dry run build & publish
        if: inputs.dry_run
        run: |
          pnpm --filter "@synergy-js/${{ inputs.package }}" build
          pnpm --filter "@synergy-js/${{ inputs.package }}" publish --dry-run --provenance --access public --no-git-checks

      - name: Bump version, publish & tag
        if: ${{ !inputs.dry_run }}
        run: |
          PKG_FILTER="@synergy-js/${{ inputs.package }}"
          PKG_DIR="packages/${{ inputs.package }}"

          # 1. Bump version while working tree is clean
          if [ "${{ inputs.bump }}" = "prerelease" ]; then
            pnpm --filter "$PKG_FILTER" version prerelease --preid alpha --no-git-tag-version
          else
            pnpm --filter "$PKG_FILTER" version "${{ inputs.bump }}" --no-git-tag-version
          fi

          # 2. Build the newly bumped package
          pnpm --filter "$PKG_FILTER" build

          # 3. Publish with OIDC provenance (--no-git-checks is required here because step 1 modified package.json)
          if [ "${{ inputs.bump }}" = "prerelease" ]; then
            pnpm --filter "$PKG_FILTER" publish --tag alpha --provenance --access public --no-git-checks
          else
            pnpm --filter "$PKG_FILTER" publish --provenance --access public --no-git-checks
          fi

          # 4. Commit bumped package.json and push package-scoped tag
          VER=$(node -p "require('./${PKG_DIR}/package.json').version")
          TAG="${{ inputs.package }}@${VER}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          git add "${PKG_DIR}/package.json"
          git commit -m "release(${{ inputs.package }}): v${VER}"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "HEAD:${{ github.ref_name }}" "$TAG"
