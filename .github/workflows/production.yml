name: Release
on:
  push:
    branches:
      - main # Triggers when you push or merge to your main branch

# CRUCIAL FOR PROVENANCE: This grants the token creation rights npm requires
permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest # Crucial: Must be an official GitHub-hosted cloud runner
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release PR or Publish to npm
        uses: changeset/action@v4
        with:
          # This handles both generating the PR and publishing
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NEXUS_TOKEN_OR_NPM_TOKEN }} # Your npm automation token
