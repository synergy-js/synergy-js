name: Test Publish Pipeline
on: [ push ]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'pnpm'
          # Point the default runner registry directly to your local Nexus instance
          registry-url: 'http://localhost:8081/repository/npm-private/'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish to Private Nexus
        run: pnpm changeset publish
        env:
          # Your Nexus deployment auth token
          NODE_AUTH_TOKEN: ${{ secrets.NEXUS_TOKEN }}
  `