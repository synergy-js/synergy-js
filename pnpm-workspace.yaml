packages:
  - packages/*
  - sandboxes/*
  - docs/*

catalog:
  "typescript": "^7.0.2"
  "unocss": "66.10.5"
  "@types/node": "^25.9.9"
  "@types/bun": "^1.4.4"
  "@rslib/core": "^1.0.7"
  "@rsdoctor/rspack-plugin": "^1.6.5"
  "@rsbuild/core": "^2.3.4"
  "@rspress/core": "^2.1.2"
  "@types/react": "^19.3.0"
  "@types/react-dom": "^19.3.0"
  "react": "^19.3.1"
  "react-dom": "^19.3.1"
  "magic-string": "^1.4.5"
  "vite": "^8.3.8"
  "@rstest/adapter-rsbuild": "^0.12.6"
  "@rstest/core": "^0.12.6"
  "@rstest/playwright": "^0.12.6"
  "tailwindcss": "^4.3.5"
  "solid-js": "^1.9.20"
  "rstack": "0.9.0"
  "taze": "^21.3.0"
  "wireit": "^0.15.0"
  "oxc-parser": "^0.160.0"
  "happy-dom": "^21.0.4"

lockfile:
  includeResolutionSettings: true
minimumReleaseAgeExclude:
  - tailwindcss@4.3.5
  - "@tailwindcss/node@4.3.5"
  - "@tailwindcss/oxide-android-arm64@4.3.5"
  - "@tailwindcss/oxide-darwin-arm64@4.3.5"
  - "@tailwindcss/oxide-darwin-x64@4.3.5"
  - "@tailwindcss/oxide-freebsd-x64@4.3.5"
  - "@tailwindcss/oxide-linux-arm-gnueabihf@4.3.5"
  - "@tailwindcss/oxide-linux-arm64-gnu@4.3.5"
  - "@tailwindcss/oxide-linux-arm64-musl@4.3.5"
  - "@tailwindcss/oxide-linux-x64-gnu@4.3.5"
  - "@tailwindcss/oxide-linux-x64-musl@4.3.5"
  - "@tailwindcss/oxide-wasm32-wasi@4.3.5"
  - "@tailwindcss/oxide-win32-arm64-msvc@4.3.5"
  - "@tailwindcss/oxide-win32-x64-msvc@4.3.5"
  - "@tailwindcss/oxide@4.3.5"
  - "@tailwindcss/vite@4.3.5"
versioning:
  ignore:
    - './sandboxes/fusion-sandbox-rsbuild'
    - './sandboxes/fusion-sandbox-vite'
    - './sandboxes/jsxr'
    - './sandboxes/srvr-sandbox'
  lanes:
    '@synergy-js/infusion': beta
    '@synergy-js/httpx': beta
    '@synergy-js/events': beta
  changelog:
    storage: registry
allowBuilds:
  just-install: true
gitChecks: false
dedupeDirectDeps: true
autoDedupe: true
nodeLinker: isolated
dedupePeerDependents: true
color: always
permissions:
  taze:
    skills: true
skills:
  dirs:
    - .github/skills
